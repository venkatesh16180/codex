# .github/workflows/tests.yml
name: tests
on: [push]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Set up a schema-only test database
        run: |
          mkdir -p data
          python -c "import sqlite3; c = sqlite3.connect('data/librarian.db'); c.executescript(open('schema.sql').read()); c.close()"
      - run: pip install -r requirements.txt
      - run: pytest -v
      - name: Check requirements.in packages aren't missing from requirements.txt
        run: python check_requirements_drift.py